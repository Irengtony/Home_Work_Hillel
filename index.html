<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Document</title>
</head>

<body>

    <header>
        <div class="container header-wrapper">
            <img class="logo" src="./img/logo.svg" alt="logo">

            <nav class="menu">
                <button class="nav">Home</button>
                <button class="nav">Shop</button>
                <button class="nav">Plant Care</button>
                <button class="nav">Blogs</button>
            </nav>

            <button class="enter_btn">
                <img src="./img/button.svg" alt="button">
            </button>
        </div>
    </header>

    <section class="section1">
        <div class="container section-content">

            <div class="leftsite">
                <h3>Welcome to GreenShop</h3>

                <h1>
                    LET’S MAKE A BETTER <span>PLANET</span>
                </h1>

                <h4>
                    We are an online plant shop offering a wide range of cheap and trendy plants.
                    Use our plants to create an unique Urban Jungle. Order your favorite plants!
                </h4>

                <button class="shop-btn">
                    SHOP NOW
                </button>
            </div>

            <div class="rightsite">
                <img src="./img/flover.png" class="big-img">
                <img src="./img/small-flover.png" class="small-img">
            </div>

        </div>
    </section>

</body>

</html>
